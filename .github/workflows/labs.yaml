name: Labs CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test ${{ matrix.project }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Game
            path: lab1/task1/game

          - project: Post
            path: lab1/task2/Post/Post

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Configure CMake
        run: cmake -S "${{ matrix.path }}" -B "${{ matrix.path }}/build"

      - name: Build application and tests
        run: cmake --build "${{ matrix.path }}/build" --config Debug --parallel

      - name: Run unit tests
        run: ctest --test-dir "${{ matrix.path }}/build" -C Debug --output-on-failure --no-tests=error
  coverage:
    name: Coverage ${{ matrix.project }}
    needs: build-and-test
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Game
            path: lab1/task1/game
            sources: game

          - project: Post
            path: lab1/task2/Post/Post
            sources: Post

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Install coverage tool
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr

      - name: Configure coverage build
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="--coverage -O0 -g"

      - name: Build application and tests
        run: cmake --build build --parallel

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Generate report and check 90 percent
        run: |
          mkdir -p coverage
          gcovr \
            --root . \
            --filter "${{ matrix.sources }}/" \
            --exclude '.*/tests?\.cpp$' \
            --exclude '.*/catch\.hpp$' \
            --exclude '.*/main\.cpp$' \
            --txt \
            --html-details coverage/index.html \
            --fail-under-line 90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.project }}
          path: ${{ matrix.path }}/coverage/
          if-no-files-found: warn
  static-analysis:
    name: Static analysis ${{ matrix.project }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Game
            path: lab1/task1/game
            sources: game

          - project: Post
            path: lab1/task2/Post/Post
            sources: Post

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Analyze source code
        run: >
          cppcheck
          --enable=warning,performance,portability
          --std=c++14
          --error-exitcode=1
          -i "${{ matrix.sources }}/test.cpp"
          -i "${{ matrix.sources }}/tests.cpp"
          "${{ matrix.sources }}/"
  release:
    name: Build and publish release
    needs: [build-and-test, coverage, static-analysis]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    permissions:
      contents: write

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Configure Game release
        run: >
          cmake
          -S lab1/task1/game
          -B lab1/task1/game/build
          -A x64
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build Game release
        run: cmake --build lab1/task1/game/build --config Release --parallel

      - name: Test Game release
        run: >
          ctest
          --test-dir lab1/task1/game/build
          -C Release
          --output-on-failure
          --no-tests=error

      - name: Configure Post release
        run: >
          cmake
          -S lab1/task2/Post/Post
          -B lab1/task2/Post/Post/build
          -A x64
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build Post release
        run: cmake --build lab1/task2/Post/Post/build --config Release --parallel

      - name: Test Post release
        run: >
          ctest
          --test-dir lab1/task2/Post/Post/build
          -C Release
          --output-on-failure
          --no-tests=error

      - name: Create release archive
        run: |
          New-Item -ItemType Directory -Path release-files -Force | Out-Null

          Copy-Item "lab1/task1/game/build/Release/Game.exe" "release-files/Game.exe"
          Copy-Item "lab1/task2/Post/Post/build/Release/Post.exe" "release-files/Post.exe"
          Copy-Item "lab1/task2/Post/Post/Post/example.txt" "release-files/example.txt"

          @(
            "Lab 1 - Windows x64"
            ""
            "Extract the archive before running."
            "Open Command Prompt in the extracted folder."
            ""
            "Fifteen Puzzle:"
            "Game.exe"
            ""
            "Post Machine:"
            "Post.exe example.txt"
            ""
            "Post Machine with logging:"
            "Post.exe example.txt -log"
          ) | Set-Content -Path "release-files/README.txt" -Encoding ascii

          Compress-Archive -Path "release-files/*" -DestinationPath "lab1-windows-x64.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:GITHUB_REF_NAME"
          "lab1-windows-x64.zip"
          --verify-tag
          --title "$env:GITHUB_REF_NAME"
          --generate-notes